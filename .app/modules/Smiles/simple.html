<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <img data-smiles="OC(C(=O)O[C@H]1C[N+]2(CCCOC3=CC=CC=C3)CCC1CC2)(C1=CC=CS1)C1=CC=CS1" 
            data-smiles-options='{ "width": 600, "height": 400, "padding": 1.0 }' />

    <br />
                                
    <svg data-smiles="C=CCBr.[Na+].[I-]>CC(=O)C>C=CCI.[Na+].[Br-]  __{'textBelowArrow': '90%'}__" />

    <script type="text/javascript" src="smiles-drawer.min.js"></script>
    <script> SmiDrawer.apply(); </script>
    <script type="text/javascript">
      const svgs = document.querySelectorAll('svg[data-smiles]')
      // Scale each SVG element
      svgs.forEach(svg => {
        const {x, y, width, height} = svg.viewBox.baseVal
        const scale = 600 / width

        svg.setAttribute('transform',`scale(${scale})`);
      })
    </script>
</body>
</html>
